name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub Release and download page"
        type: boolean
        default: false
        required: true
      stable_tag:
        description: "Stable checkpoint tag that must point to the published source commit"
        type: string
        default: "upload-flow-stable-2026-09-22"
        required: true
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-release-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  COMPILE_SDK: "37"
  BUILD_TOOLS_VERSION: "36.0.0"
  NDK_VERSION: "29.0.14206865"
  CMAKE_VERSION: "3.22.1"

jobs:
  build-release-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    outputs:
      release_tag: ${{ steps.apk.outputs.release_tag }}
      release_url: ${{ steps.apk.outputs.release_url }}
      download_url: ${{ steps.apk.outputs.download_url }}
      apk_name: ${{ steps.apk.outputs.apk_name }}
      apk_sha256: ${{ steps.apk.outputs.apk_sha256 }}
      signing_cert_sha256: ${{ steps.apk.outputs.signing_cert_sha256 }}
      english_config_sha256: ${{ steps.apk.outputs.english_config_sha256 }}
      swahili_config_sha256: ${{ steps.apk.outputs.swahili_config_sha256 }}
      stable_tag: ${{ steps.apk.outputs.stable_tag }}
      short_sha: ${{ steps.apk.outputs.short_sha }}
      branch: ${{ steps.apk.outputs.branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android CLI
        run: |
          set -euo pipefail
          curl -fsSL \
            https://dl.google.com/android/cli/latest/linux_x86_64/install_root.sh \
            | sudo bash

          command -v android
          android --version

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          android --sdk="$ANDROID_SDK_ROOT" \
            sdk install \
            --canary \
            platform-tools \
            "platforms/android-${COMPILE_SDK}.0" \
            "build-tools/${BUILD_TOOLS_VERSION}" \
            "ndk/${NDK_VERSION}" \
            "cmake/${CMAKE_VERSION}"

          test -f "$ANDROID_SDK_ROOT/platforms/android-${COMPILE_SDK}.0/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS_VERSION}/apksigner"
          test -x "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS_VERSION}/zipalign"
          test -d "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          test -d "$ANDROID_SDK_ROOT/cmake/${CMAKE_VERSION}"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Configure Survey2026 Gradle properties
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"

          GH_OWNER="${{ vars.GH_OWNER }}"
          GH_REPO="${{ vars.GH_REPO }}"
          GH_BRANCH="${{ vars.GH_BRANCH }}"
          GH_PATH_PREFIX="${{ vars.GH_PATH_PREFIX }}"
          GH_TOKEN="${{ secrets.GH_TOKEN }}"

          if [[ -z "$GH_OWNER" ]]; then GH_OWNER="${{ github.repository_owner }}"; fi
          if [[ -z "$GH_REPO" ]]; then GH_REPO="SurveyExports"; fi
          if [[ -z "$GH_BRANCH" ]]; then GH_BRANCH="main"; fi
          if [[ -z "$GH_PATH_PREFIX" ]]; then GH_PATH_PREFIX=""; fi

          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::GH_TOKEN is not configured. BuildConfig GH_TOKEN will be empty."
          fi

          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          SUPABASE_LOG_BUCKET="${{ vars.SUPABASE_LOG_BUCKET }}"
          SUPABASE_LOG_PREFIX="${{ vars.SUPABASE_LOG_PREFIX }}"

          if [[ -z "$SUPABASE_LOG_BUCKET" ]]; then SUPABASE_LOG_BUCKET="logs"; fi
          if [[ -z "$SUPABASE_LOG_PREFIX" ]]; then SUPABASE_LOG_PREFIX="surveyapp"; fi

          PUBLISH_RELEASE="${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) }}"

          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            RELEASE_ALLOW_SECRETS=true
            if [[ -z "$GH_TOKEN" ]]; then
              echo "::error::GH_TOKEN is required for an internal release."
              exit 1
            fi
          else
            RELEASE_ALLOW_SECRETS=false
          fi

          cat > "$HOME/.gradle/gradle.properties" <<PROPS
          # ---- GitHub config ----
          github.owner=$GH_OWNER
          github.repo=$GH_REPO
          github.branch=$GH_BRANCH
          github.pathPrefix=$GH_PATH_PREFIX
          github.token=$GH_TOKEN

          gh.owner=$GH_OWNER
          gh.repo=$GH_REPO
          gh.branch=$GH_BRANCH
          gh.pathPrefix=$GH_PATH_PREFIX
          gh.token=$GH_TOKEN

          # ---- Supabase config ----
          supabase.url=$SUPABASE_URL
          supabase.anonKey=$SUPABASE_ANON_KEY
          supabase.logBucket=$SUPABASE_LOG_BUCKET
          supabase.logPrefix=$SUPABASE_LOG_PREFIX

          # ---- Hugging Face token ----
          release.allowSecrets=$RELEASE_ALLOW_SECRETS
          PROPS

          echo "::group::gradle.properties (redacted view)"
          sed -E \
            -e 's/(github\.token=).*/\1***REDACTED***/g' \
            -e 's/(gh\.token=).*/\1***REDACTED***/g' \
            -e 's/(supabase\.url=).*/\1***REDACTED***/g' \
            -e 's/(supabase\.anonKey=).*/\1***REDACTED***/g' \
            "$HOME/.gradle/gradle.properties"
          echo "::endgroup::"

      - name: Validate Android signing configuration
        id: signing
        env:
          PUBLISH_RELEASE: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) }}
        run: |
          set -euo pipefail
          signing_values=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )

          configured=0
          for name in "${signing_values[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              configured=$((configured + 1))
            fi
          done

          if (( configured != 0 && configured != ${#signing_values[@]} )); then
            echo "::error::Android signing is partially configured. Configure all four Survey2026 signing secrets or none of them."
            exit 1
          fi

          if [[ "$PUBLISH_RELEASE" != "true" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "::notice::Build-only mode does not apply external release signing."
            exit 0
          fi

          if (( configured == 0 )); then
            echo "::error::A public release requires all four Survey2026 signing secrets."
            exit 1
          fi

          umask 077
          SIGNING_DIR="$RUNNER_TEMP/survey2026-signing"
          KEYSTORE="$SIGNING_DIR/release.keystore"
          mkdir -p "$SIGNING_DIR"

          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 could not be decoded."
            exit 1
          fi
          chmod 600 "$KEYSTORE"

          if [[ ! -s "$KEYSTORE" ]]; then
            echo "::error::Decoded Android keystore is empty."
            exit 1
          fi

          keytool \
            -J-Duser.language=en \
            -list \
            -keystore "$KEYSTORE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Android release signing configuration validated."

      - name: Detect and run optional model preparation
        id: model
        run: |
          set -euo pipefail
          TASKS_FILE="$RUNNER_TEMP/app-gradle-tasks.txt"
          ./gradlew :app:tasks --all --no-daemon > "$TASKS_FILE"

          if grep -Eq '^downloadModel([[:space:]]|$)' "$TASKS_FILE"; then
            ./gradlew :app:downloadModel --stacktrace --no-daemon
            echo "ran=true" >> "$GITHUB_OUTPUT"
            echo "RAN_DOWNLOAD_MODEL=true" >> "$GITHUB_ENV"
          else
            echo "::notice::Task :app:downloadModel is not available; skipping model preparation."
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "RAN_DOWNLOAD_MODEL=false" >> "$GITHUB_ENV"
          fi

      - name: Lint app
        run: |
          set -euo pipefail
          args=(":app:lint" "--stacktrace" "--no-daemon")
          if [[ "$RAN_DOWNLOAD_MODEL" == "true" ]]; then
            args+=("-x" ":app:downloadModel")
          fi
          ./gradlew "${args[@]}"

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon -PskipModelDownload=true

      - name: Build release APK
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PUBLISH_RELEASE: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_RELEASE" == "true" && -z "$HF_TOKEN" ]]; then
            echo "::error::HF_TOKEN is required for an internal release."
            exit 1
          fi
          args=(":app:assembleRelease" "--stacktrace" "--no-daemon")
          if [[ "$RAN_DOWNLOAD_MODEL" == "true" ]]; then
            args+=("-x" ":app:downloadModel")
          fi
          ./gradlew "${args[@]}"

      - name: Verify and collect release APK
        id: apk
        env:
          PUBLISH_RELEASE: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) }}
          STABLE_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.stable_tag || '' }}
        run: |
          set -euo pipefail

          STABLE_TAG=""
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "$PUBLISH_RELEASE" == "true" && -n "$STABLE_TAG_INPUT" ]]; then
            STABLE_TAG="${STABLE_TAG_INPUT}"
            git fetch --force --tags origin "refs/tags/${STABLE_TAG}:refs/tags/${STABLE_TAG}"
            TAG_COMMIT="$(git rev-list -n 1 "$STABLE_TAG")"
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "::error::Stable tag $STABLE_TAG points to $TAG_COMMIT, but this workflow is building $GITHUB_SHA."
              exit 1
            fi
            echo "Stable tag verified: $STABLE_TAG -> $GITHUB_SHA"
          elif [[ "$PUBLISH_RELEASE" == "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::stable_tag is required for a manually published non-main release."
            exit 1
          elif [[ "$PUBLISH_RELEASE" == "true" ]]; then
            echo "::notice::Publishing the current main build without a stable checkpoint tag."
          fi
          APK_DIR="app/build/outputs/apk/release"
          if [[ ! -d "$APK_DIR" ]]; then
            echo "::error::Release APK directory does not exist: $APK_DIR"
            exit 1
          fi

          mapfile -d '' apks < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print0)
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected exactly one release APK in $APK_DIR; found ${#apks[@]}."
            find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print
            exit 1
          fi

          APK="${apks[0]}"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Release APK is missing or empty: $APK"
            exit 1
          fi

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/zipalign"
          if [[ ! -x "$APKSIGNER" || ! -x "$ZIPALIGN" ]]; then
            echo "::error::Required Android APK tools are unavailable."
            exit 1
          fi

          FINAL_APK="$APK"
          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            if [[ "$SIGNING_CONFIGURED" != "true" ]]; then
              echo "::error::Public release requested without release signing configuration."
              exit 1
            fi

            FINAL_APK="$RUNNER_TEMP/survey2026-aligned-release.apk"
            "$ZIPALIGN" -P 16 -f 4 "$APK" "$FINAL_APK"
            "$ZIPALIGN" -c -P 16 4 "$FINAL_APK"

            "$APKSIGNER" sign \
              --ks "$ANDROID_KEYSTORE_FILE" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass env:ANDROID_KEY_PASSWORD \
              "$FINAL_APK"
          fi

          INSPECT_DIR="$(mktemp -d)"
          trap 'rm -rf "$INSPECT_DIR"' EXIT
          unzip -qq "$FINAL_APK" 'classes*.dex' -d "$INSPECT_DIR"
          find "$INSPECT_DIR" -type f -name 'classes*.dex' -exec strings {} + > "$INSPECT_DIR/dex-strings.txt"
          if grep -Fq 'hf_' "$INSPECT_DIR/dex-strings.txt"; then
            echo "::error::Plaintext Hugging Face token marker detected in release APK."
            exit 1
          fi

          SIGNING_CERT_SHA256=""
          VERIFY_OUTPUT="$RUNNER_TEMP/apksigner-verify.txt"
          if "$APKSIGNER" verify --verbose --print-certs "$FINAL_APK" > "$VERIFY_OUTPUT" 2>&1; then
            cat "$VERIFY_OUTPUT"
            SIGNING_CERT_SHA256="$(awk -F': ' '/certificate SHA-256 digest:/ {print tolower($NF); exit}' "$VERIFY_OUTPUT")"
            if [[ -z "$SIGNING_CERT_SHA256" ]]; then
              echo "::error::APK signature verified, but its signer certificate SHA-256 could not be read."
              exit 1
            fi
          else
            cat "$VERIFY_OUTPUT"
            if [[ "$SIGNING_CONFIGURED" == "true" || "$PUBLISH_RELEASE" == "true" ]]; then
              echo "::error::Expected a signed APK, but signature verification failed."
              exit 1
            fi
            echo "::notice::The build-only APK is unsigned."
          fi

          if [[ "$PUBLISH_RELEASE" == "true" && -z "$SIGNING_CERT_SHA256" ]]; then
            echo "::error::A public release requires a verified signed APK."
            exit 1
          fi

          BRANCH="${GITHUB_REF_NAME}"
          APK_NAME="Survey2026-${SHORT_SHA}-release.apk"
          OUTPUT="$RUNNER_TEMP/$APK_NAME"
          cp "$FINAL_APK" "$OUTPUT"
          APK_SHA256="$(sha256sum "$OUTPUT" | awk '{print $1}')"
          RELEASE_TAG="build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}"

          ENGLISH_CONFIG="$RUNNER_TEMP/survey_config10.yaml"
          SWAHILI_CONFIG="$RUNNER_TEMP/survey_config_sw_10.yaml"
          ENGLISH_CONFIG_SHA256=""
          SWAHILI_CONFIG_SHA256=""
          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            if ! unzip -p "$OUTPUT" assets/survey_config10.yaml > "$ENGLISH_CONFIG"; then
              echo "::error::Release APK is missing assets/survey_config10.yaml."
              exit 1
            fi
            if ! unzip -p "$OUTPUT" assets/survey_config_sw_10.yaml > "$SWAHILI_CONFIG"; then
              echo "::error::Release APK is missing assets/survey_config_sw_10.yaml."
              exit 1
            fi
            if [[ ! -s "$ENGLISH_CONFIG" || ! -s "$SWAHILI_CONFIG" ]]; then
              echo "::error::Release APK config asset is missing or empty."
              exit 1
            fi
            if ! cmp -s "$ENGLISH_CONFIG" app/src/main/assets/survey_config10.yaml || \
               ! cmp -s "$SWAHILI_CONFIG" app/src/main/assets/survey_config_sw_10.yaml; then
              echo "::error::Release APK config assets differ from source assets."
              exit 1
            fi

            ENGLISH_CONFIG_SHA256="$(sha256sum "$ENGLISH_CONFIG" | awk '{print $1}')"
            SWAHILI_CONFIG_SHA256="$(sha256sum "$SWAHILI_CONFIG" | awk '{print $1}')"
          fi

          echo "path=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "signing_cert_sha256=$SIGNING_CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "english_config_sha256=$ENGLISH_CONFIG_SHA256" >> "$GITHUB_OUTPUT"
          echo "swahili_config_sha256=$SWAHILI_CONFIG_SHA256" >> "$GITHUB_OUTPUT"
          echo "stable_tag=$STABLE_TAG" >> "$GITHUB_OUTPUT"
          echo "english_config_path=$ENGLISH_CONFIG" >> "$GITHUB_OUTPUT"
          echo "swahili_config_path=$SWAHILI_CONFIG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          echo "APK: $APK_NAME"
          echo "APK SHA-256: $APK_SHA256"
          if [[ -n "$SIGNING_CERT_SHA256" ]]; then
            echo "Signing certificate SHA-256: $SIGNING_CERT_SHA256"
          else
            echo "Signing certificate SHA-256: unavailable (unsigned APK)"
          fi

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Survey2026-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: ${{ steps.apk.outputs.path }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
          DOWNLOAD_URL: ${{ steps.apk.outputs.download_url }}
          ENGLISH_CONFIG: ${{ steps.apk.outputs.english_config_path }}
          SWAHILI_CONFIG: ${{ steps.apk.outputs.swahili_config_path }}
          APK_SHA256: ${{ steps.apk.outputs.apk_sha256 }}
          SIGNING_CERT_SHA256: ${{ steps.apk.outputs.signing_cert_sha256 }}
          ENGLISH_CONFIG_SHA256: ${{ steps.apk.outputs.english_config_sha256 }}
          SWAHILI_CONFIG_SHA256: ${{ steps.apk.outputs.swahili_config_sha256 }}
          STABLE_TAG: ${{ steps.apk.outputs.stable_tag }}
          RELEASE_TAG: ${{ steps.apk.outputs.release_tag }}
        run: |
          set -euo pipefail
          test -s "$APK"
          test -s "$ENGLISH_CONFIG"
          test -s "$SWAHILI_CONFIG"
          test -n "$SIGNING_CERT_SHA256"
          test -n "$ENGLISH_CONFIG_SHA256"
          test -n "$SWAHILI_CONFIG_SHA256"

          # Standalone, print-ready QR code (larger, with a quiet zone) that downloads this release's APK.
          # It is optional: a failure only warns and never blocks the release.
          RELEASE_ASSETS=("$APK" "$ENGLISH_CONFIG" "$SWAHILI_CONFIG")
          QR_NAME="${APK_NAME%.apk}-qr.png"
          QR="$RUNNER_TEMP/$QR_NAME"
          QR_IMAGE_URL=""
          if [[ -n "$DOWNLOAD_URL" ]] \
            && curl --fail --silent --show-error --location \
              --retry 3 \
              --retry-all-errors \
              --get \
              --data-urlencode "size=1000x1000" \
              --data-urlencode "qzone=4" \
              --data-urlencode "data=$DOWNLOAD_URL" \
              "https://api.qrserver.com/v1/create-qr-code/" \
              --output "$QR" \
            && [[ -s "$QR" ]] \
            && [[ "$(file -b --mime-type "$QR")" == "image/png" ]]; then
            RELEASE_ASSETS+=("$QR")
            QR_IMAGE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${QR_NAME}"
          else
            echo "::warning::Could not generate a PNG QR code for the release APK download link; publishing the release without it."
          fi

          NOTES="$RUNNER_TEMP/survey2026-release-notes.md"
          {
            echo "# Survey2026 ${RELEASE_TAG}"
            echo
            echo "Verified Android release APK."
            echo
            if [[ -n "$STABLE_TAG" ]]; then
              echo "- Stable checkpoint: ${STABLE_TAG}"
            else
              echo "- Source branch: ${GITHUB_REF_NAME}"
            fi
            echo "- Source commit SHA: ${GITHUB_SHA}"
            echo "- Workflow run number: ${GITHUB_RUN_NUMBER}"
            echo "- APK filename: ${APK_NAME}"
            echo "- APK SHA-256: ${APK_SHA256}"
            echo "- English config SHA-256: ${ENGLISH_CONFIG_SHA256}"
            echo "- Swahili config SHA-256: ${SWAHILI_CONFIG_SHA256}"
            echo "- Signing certificate SHA-256: ${SIGNING_CERT_SHA256}"
            if [[ -n "$QR_IMAGE_URL" ]]; then
              echo
              echo "## Scan to download"
              echo
              printf '<img src="%s" width="240" alt="QR code that downloads %s">\n' "$QR_IMAGE_URL" "$APK_NAME"
            fi
          } > "$NOTES"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${RELEASE_ASSETS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Survey2026 build #${GITHUB_RUN_NUMBER}" \
              --notes-file "$NOTES" \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${RELEASE_ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "Survey2026 build #${GITHUB_RUN_NUMBER}" \
              --notes-file "$NOTES" \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Clean up signing material
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/survey2026-signing"

  publish-download-page:
    name: Publish mobile download page
    runs-on: ubuntu-latest
    needs: build-release-apk
    if: ${{ github.ref == 'refs/heads/main' }}
    concurrency:
      # This job and BranchBuild both push to gh-pages.
      group: branch-apk-preview-pages
      cancel-in-progress: false

    steps:
      - name: Generate download page
        env:
          RELEASE_TAG: ${{ needs.build-release-apk.outputs.release_tag }}
          RELEASE_URL: ${{ needs.build-release-apk.outputs.release_url }}
          DOWNLOAD_URL: ${{ needs.build-release-apk.outputs.download_url }}
          APK_NAME: ${{ needs.build-release-apk.outputs.apk_name }}
          APK_SHA256: ${{ needs.build-release-apk.outputs.apk_sha256 }}
          SIGNING_CERT_SHA256: ${{ needs.build-release-apk.outputs.signing_cert_sha256 }}
          ENGLISH_CONFIG_SHA256: ${{ needs.build-release-apk.outputs.english_config_sha256 }}
          SWAHILI_CONFIG_SHA256: ${{ needs.build-release-apk.outputs.swahili_config_sha256 }}
          STABLE_TAG: ${{ needs.build-release-apk.outputs.stable_tag }}
          SHORT_SHA: ${{ needs.build-release-apk.outputs.short_sha }}
          BRANCH: ${{ needs.build-release-apk.outputs.branch }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          for name in RELEASE_TAG RELEASE_URL DOWNLOAD_URL APK_NAME APK_SHA256 SIGNING_CERT_SHA256 ENGLISH_CONFIG_SHA256 SWAHILI_CONFIG_SHA256 SHORT_SHA BRANCH; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing download-page value: $name"
              exit 1
            fi
          done

          mkdir -p download-page
          GENERATED_UTC="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
          REPO_URL="${SERVER_URL}/${REPOSITORY}"
          QR_URL="qr.png"
          ENGLISH_CONFIG_URL="${SERVER_URL}/${REPOSITORY}/releases/download/${RELEASE_TAG}/survey_config10.yaml"
          SWAHILI_CONFIG_URL="${SERVER_URL}/${REPOSITORY}/releases/download/${RELEASE_TAG}/survey_config_sw_10.yaml"
          ENGLISH_CONFIG_VIEW_URL="${SERVER_URL}/${REPOSITORY}/blob/${GITHUB_SHA}/app/src/main/assets/survey_config10.yaml"
          SWAHILI_CONFIG_VIEW_URL="${SERVER_URL}/${REPOSITORY}/blob/${GITHUB_SHA}/app/src/main/assets/survey_config_sw_10.yaml"

          curl --fail --silent --show-error --location \
            --retry 3 \
            --retry-all-errors \
            --get \
            --data-urlencode "size=300x300" \
            --data-urlencode "data=$DOWNLOAD_URL" \
            "https://api.qrserver.com/v1/create-qr-code/" \
            --output download-page/qr.png
          if [[ ! -s download-page/qr.png ]] || [[ "$(file -b --mime-type download-page/qr.png)" != "image/png" ]]; then
            echo "::error::Failed to generate a PNG QR code for the main download page."
            exit 1
          fi

          cat > download-page/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
            <meta name="robots" content="noindex,nofollow">
            <title>Survey2026 Android APK</title>
            <style>
              :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
              * { box-sizing: border-box; }
              body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #24496f 0, #0b1726 42%, #060a10 100%); color: #eef6ff; }
              main { width: min(920px, calc(100% - 24px)); margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 0 max(28px, env(safe-area-inset-bottom)); }
              .card { border: 1px solid rgba(255,255,255,.13); border-radius: 24px; padding: clamp(22px,5vw,44px); background: rgba(10,24,40,.88); box-shadow: 0 24px 80px rgba(0,0,0,.38); backdrop-filter: blur(16px); }
              .eyebrow { margin: 0 0 8px; color: #91c8ff; font-size: .8rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
              h1 { margin: 0; font-size: clamp(2rem,7vw,3.6rem); line-height: 1.04; }
              h2 { margin-top: 0; }
              .subtitle { margin: 18px 0 24px; color: #becde0; line-height: 1.65; }
              .download { display: flex; width: 100%; min-height: 64px; align-items: center; justify-content: center; padding: 0 24px; border-radius: 16px; background: #e9f3ff; color: #07111d; font-size: 1.1rem; font-weight: 850; text-decoration: none; }
              .download:hover { opacity: .94; }
              .note { color: #95a9c0; font-size: .88rem; line-height: 1.55; }
              .config-files { margin-top: 24px; padding: 20px; border-radius: 18px; background: rgba(255,255,255,.055); }
              .config-files h2 { margin-bottom: 8px; }
              .config-files p { margin: 0 0 12px; }
              .config-files a { color: #9dccff; }
              .qr-panel { display: grid; grid-template-columns: 300px 1fr; gap: 30px; align-items: center; margin-top: 30px; padding: 24px; border-radius: 18px; background: rgba(255,255,255,.055); }
              .qr-box { padding: 10px; border-radius: 18px; background: #fff; }
              .qr-box img { display: block; width: 100%; height: auto; }
              .grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; margin-top: 30px; }
              .item { padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,.055); }
              .label { display: block; margin-bottom: 7px; color: #91a5bd; font-size: .74rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
              code { overflow-wrap: anywhere; color: #f6f9ff; }
              .links { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 30px; padding-top: 26px; border-top: 1px solid rgba(255,255,255,.1); }
              .links a { color: #9dccff; }
              footer { margin-top: 26px; color: #7f94ac; font-size: .82rem; }
              @media (max-width: 700px) { main { width: min(100% - 16px, 920px); padding-top: 8px; } .card { border-radius: 18px; padding: 22px 18px 26px; } .qr-panel { display: none; } .grid { grid-template-columns: 1fr; } h1 { font-size: clamp(2rem,12vw,3rem); } }
            </style>
          </head>
          <body>
            <main>
              <section class="card">
                <p class="eyebrow">Survey2026</p>
                <h1>Latest Android Build</h1>
                <p class="subtitle">Open this page on an Android phone and download the latest verified Survey2026 release APK directly.</p>
                <section class="config-files">
                  <h2>Build provenance</h2>
                  ${STABLE_TAG:+<p><strong>Stable checkpoint:</strong> <code>${STABLE_TAG}</code></p>}
                  <p>
                  <strong>Source:</strong> <code>${GITHUB_SHA}</code></p>
                </section>
                <a class="download" href="${DOWNLOAD_URL}">Download APK</a>
                <p class="note">Direct GitHub Release asset. No ZIP extraction is required.</p>
                <section class="config-files">
                  <h2>Config files included in this APK</h2>
                  <p class="note">These config files were extracted from the exact APK build shown on this page.</p>
                  <p><strong>English — survey_config10.yaml</strong><br><a href="${ENGLISH_CONFIG_VIEW_URL}">View in browser</a> · <a href="${ENGLISH_CONFIG_URL}">Download</a><br><code>SHA-256: ${ENGLISH_CONFIG_SHA256}</code></p>
                  <p><strong>Swahili — survey_config_sw_10.yaml</strong><br><a href="${SWAHILI_CONFIG_VIEW_URL}">View in browser</a> · <a href="${SWAHILI_CONFIG_URL}">Download</a><br><code>SHA-256: ${SWAHILI_CONFIG_SHA256}</code></p>
                </section>
                <div class="qr-panel">
                  <div class="qr-box"><img src="${QR_URL}" alt="QR code that downloads the Survey2026 APK for ${RELEASE_TAG}" width="300" height="300"></div>
                  <div><h2>Scan with Android</h2><p class="subtitle">This QR code downloads the APK for this build (${RELEASE_TAG}).</p><code>${DOWNLOAD_URL}</code></div>
                </div>
                <div class="grid">
                  <div class="item"><span class="label">Release tag</span><code>${RELEASE_TAG}</code></div>
                  <div class="item"><span class="label">Branch</span><code>${BRANCH}</code></div>
                  <div class="item"><span class="label">Commit SHA</span><code>${SHORT_SHA}</code></div>
                  <div class="item"><span class="label">APK filename</span><code>${APK_NAME}</code></div>
                  <div class="item"><span class="label">Workflow run number</span><code>${RUN_NUMBER}</code></div>
                  <div class="item"><span class="label">APK SHA-256</span><code>${APK_SHA256}</code></div>
                  <div class="item"><span class="label">Signing certificate SHA-256</span><code>${SIGNING_CERT_SHA256}</code></div>
                  <div class="item"><span class="label">Generated timestamp</span><code>${GENERATED_UTC}</code></div>
                </div>
                <div class="links">
                  <a href="${RELEASE_URL}">GitHub Release</a>
                  <a href="${RUN_URL}">GitHub Actions run</a>
                  <a href="${REPO_URL}">Repository</a>
                </div>
                <footer>Survey2026 release metadata generated ${GENERATED_UTC}.</footer>
              </section>
            </main>
          </body>
          </html>
          HTML

          cat > download-page/latest.json <<JSON
          {
            "repository": "${REPOSITORY}",
            "stable_tag": "${STABLE_TAG}",
            "source_commit_sha": "${GITHUB_SHA}",
            "release_tag": "${RELEASE_TAG}",
            "branch": "${BRANCH}",
            "release_url": "${RELEASE_URL}",
            "download_url": "${DOWNLOAD_URL}",
            "config_files": {
              "english": {
                "view_url": "${ENGLISH_CONFIG_VIEW_URL}",
                "download_url": "${ENGLISH_CONFIG_URL}",
                "sha256": "${ENGLISH_CONFIG_SHA256}"
              },
              "swahili": {
                "view_url": "${SWAHILI_CONFIG_VIEW_URL}",
                "download_url": "${SWAHILI_CONFIG_URL}",
                "sha256": "${SWAHILI_CONFIG_SHA256}"
              }
            },
            "apk_name": "${APK_NAME}",
            "apk_sha256": "${APK_SHA256}",
            "signing_cert_sha256": "${SIGNING_CERT_SHA256}",
            "short_sha": "${SHORT_SHA}",
            "run_id": "${RUN_ID}",
            "run_number": "${RUN_NUMBER}",
            "generated_utc": "${GENERATED_UTC}"
          }
          JSON

          touch download-page/.nojekyll

      - name: Check out existing GitHub Pages content
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: main-pages
          fetch-depth: 1

      - name: Publish root main download page
        run: |
          set -euo pipefail

          PAGES_DIR="main-pages"
          for file in index.html latest.json qr.png; do
            test -s "download-page/$file" || {
              echo "::error::Missing generated main Pages file: $file"
              exit 1
            }
            cp "download-page/$file" "$PAGES_DIR/$file"
          done
          test -f download-page/.nojekyll || {
            echo "::error::Missing generated main Pages file: .nojekyll"
            exit 1
          }
          cp download-page/.nojekyll "$PAGES_DIR/.nojekyll"

          git -C "$PAGES_DIR" add -- index.html latest.json .nojekyll qr.png
          if git -C "$PAGES_DIR" diff --cached --quiet; then
            echo "::error::Main Pages publication produced no changes; refusing to skip the required commit and push."
            exit 1
          fi

          git -C "$PAGES_DIR" config user.name "github-actions[bot]"
          git -C "$PAGES_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PAGES_DIR" commit -m "Update Survey2026 download page for ${{ needs.build-release-apk.outputs.release_tag }}"
          git -C "$PAGES_DIR" push origin HEAD:gh-pages
