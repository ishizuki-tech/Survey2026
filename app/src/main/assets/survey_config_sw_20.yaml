graph:
  startId: Start
  nodes:
    - id: Start
      type: START
      title: Start
      question: Start
      nextId: Q1

    - id: Q1
      type: AI
      title: Athari ya Minyoo ya Majani (Fall Armyworm)
      question: >-
        Minyoo ya majani imeathirije mavuno yako ya mahindi katika msimu mitatu iliyopita?
      nextId: Q2

    - id: Q2
      type: AI
      title: Faida za Kuvuna Mapema
      question: >-
        Kuvuna mahindi siku 10 mapema kunaathirije matokeo ya mavuno yako?
      nextId: Q3

    - id: Q3
      type: AI
      title: Kubadilisha Aina ya Mahindi (Vimelea/Magonjwa)
      question: >-
        Katika kiwango gani cha vimelea au ugonjwa ungeacha kupanda aina yako ya sasa ya mahindi na kujaribu mpya?
      nextId: Q4

    - id: Q4
      type: AI
      title: Sifa Zinazohitajika za Mahindi
      question: >-
        Ni sifa gani mpya ya mahindi ungependa iwepo ili ubadilishe aina yako ya sasa?
      nextId: Q5

    - id: Q5
      type: AI
      title: Mavuno ya Angalau Yanayokubalika
      question: >-
        Katika msimu duni, ni kiwango gani cha mavuno kitakachokufanya uendelee kupanda mahindi haya?
      nextId: Q6

    - id: Q6
      type: AI
      title: Athari ya Ukame Kulingana na Hatua za Ukuaji
      question: >-
        Ukame unaathirije mahindi katika hatua tofauti za ukuaji?
      nextId: Q7

    - id: Q7
      type: AI
      title: Mahindi Ya Njano kwa Chakula cha Mifugo
      question: >-
        Unatumiaje mahindi ya njano kwa mifugo yako?
      nextId: Q8

    - id: Q8
      type: AI
      title: "Ugawaji wa Mahindi: Chakula vs Chakula cha Mifugo"
      question: >-
        Ni vigezo gani vinavyobainisha kama mahindi yatumike kwa chakula, chakula cha mifugo, au matumizi mengine?
      nextId: Q9

    - id: Q9
      type: AI
      title: Sababu za Kula Maharagwe
      question: >-
        Ni vigezo gani vinavyoamua mara ngapi au kiasi gani cha maharagwe kaya yako inakula?
      nextId: Q10

    - id: Q10
      type: AI
      title: Chanzo na Matumizi ya Ndizi
      question: >-
        Unapataje ndizi na zinatumikaje katika kaya yako?
      nextId: Q11

    - id: Q11
      type: AI
      title: Aina za Viazi na Mapendeleo ya Usindikaji
      question: >-
        Ni aina gani za viazi wanazopendelea wasindikaji na zinatumikaje?
      nextId: Review

    - id: Review
      type: REVIEW
      title: Kagua
      question: ''
      nextId: Done

    - id: Done
      type: DONE
      title: Imekamilika
      question: ''

slm:
  # Runtime
  # NOTE: For debugging stability, prefer "CPU" to avoid EGL/OpenGL context issues.
  # accelerator: "CPU"
  accelerator: "GPU"

  # NOTE: EVAL/FOLLOWUP do not need 4096 tokens; smaller budgets reduce drift and failures.
  max_tokens: 4096
  top_k: 64
  top_p: 0.95
  temperature: 1.0
  followup_output_mode: "TEXT"

  # Turn formatting (LiteRT-LM chat style)
  # NOTE: Newlines help make boundaries explicit; remove '\n' only if your code already injects them.
  user_turn_prefix: "<start_of_turn>user\n"
  model_turn_prefix: "<start_of_turn>model\n"
  turn_end: "<end_of_turn>\n"

  # System prompt pieces
  empty_json_instruction: "Jibu kwa kitu cha JSON kilicho tupu: {}"
  preamble: "Wewe ni mtaalamu mashuhuri wa tafiti za wakulima. Soma Swali na Jibu."

  key_contract_eval: |
    OUTPUT FORMAT:
    - In Swahili.
    - Keys exactly:
      • "analysis": short string
      • "weakness": short string
      • "followup_needed": boolean
      • "followup_target": short string
      • "score": integer 1–100

    RULES:
    - Judge ONLY content relevance/completeness/accuracy.
    - Do NOT generate a follow-up question here.
    - followup_target must be single-scope (one biggest uncertainty).
    - Do NOT use double quotes (") inside string values. Use single quotes or no quotes.
    - Do NOT copy the Answer verbatim into the JSON.

  # FOLLOWUP (Call 2) is TEXT ONLY (no JSON).
  key_contract_followup: |
    OUTPUT FORMAT:
    - In Swahili.
    - Return ONLY the follow-up question as plain text on ONE LINE.
    - Do NOT output JSON.
    - Do NOT wrap the question in quotes.
    - No prefixes, no bullet points, no extra text.

    RULES:
    - Use ONLY the EVAL JSON input.
    - If followup_needed is false, output an EMPTY string (no characters).
    - If true, target exactly followup_target.
    - Single-scope, concrete, answerable immediately.
    - Do not introduce new topics or additional objectives.

  length_budget_eval: |
    LENGTH LIMITS:
    - analysis<=60 chars
    - weakness<=120 chars
    - followup_target<=80 chars
    - score is integer 1–100

  length_budget_followup: |
    LENGTH LIMITS:
    - follow-up question (text)<=120 chars

  scoring_rule: "Scoring rule: Judge ONLY content relevance/completeness/accuracy. Do NOT penalize style or formatting."

  # IMPORTANT: This field may be appended to BOTH calls by your code.
  # Therefore it contains explicit branching rules for EVAL vs FOLLOWUP.
  strict_output: |-
    STRICT OUTPUT (NO MARKDOWN):
    - If the task is EVAL: output RAW JSON only, ONE LINE.
      - Use COMPACT JSON (no spaces around ':' and ',').
      - No extra text.
    - If the task is FOLLOWUP: output ONLY the follow-up question as plain text on ONE LINE, or EMPTY output if none.
      - No JSON, no quotes, no extra text.

