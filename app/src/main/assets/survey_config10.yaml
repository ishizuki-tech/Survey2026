graph:
  startId: Start
  nodes:
    - id: Start
      type: START
      title: Start
      question: Start
      nextId: Q1

    - id: Q1
      type: AI
      title: FAW Yield Loss (3 Seasons)
      question: >-
        How much yield do you lose because of fall armyworm? Please think back over the last 3 seasons. (Percent or bags per acre are fine.)
      nextId: Q2

    - id: Q2
      type: AI
      title: Trade-off for 10-Day Earlier Harvest
      question: >-
        If you could harvest 10 days earlier, how much yield would you be willing to give up? (Percent or bags per acre.)
      nextId: Q3

    - id: Q3
      type: AI
      title: Damage Threshold to Switch Variety
      question: >-
        What level of pest or disease damage would make you stop using your current maize variety and switch to a new variety? (Give a clear threshold, e.g., % plants/ears damaged or severity.)
      nextId: Q4

    - id: Q4
      type: AI
      title: Expectations for Replacement Variety
      question: >-
        What would you expect from a new maize variety to replace the one you currently grow? Please be as detailed as possible (e.g., DTM, FAW tolerance, drought stage tolerance, typical yield).
      nextId: Q5

    - id: Q5
      type: AI
      title: Minimum Acceptable Harvest in Bad Year
      question: >-
        In a bad year, what is the smallest harvest you would accept and still plant this maize again next season? (Percent of usual harvest or bags per acre.)
      nextId: Q6

    - id: Q6
      type: AI
      title: Most Damaging Drought Timing
      question: >-
        When in the season is drought most devastating for your crop? What is the most difficult drought moment? (e.g., pre-tassel, tasseling/silking, grain fill, pre-harvest.)
      nextId: Review

    - id: Review
      type: REVIEW
      title: Review
      question: ''
      nextId: Done

    - id: Done
      type: DONE
      title: Done
      question: ''

slm:
  accelerator: GPU
  max_tokens: 512
  top_k: 1
  top_p: 0.0
  temperature: 0.0

  # Turn formatting (LiteRT-LM chat style)
  user_turn_prefix: "<start_of_turn>user"
  model_turn_prefix: "<start_of_turn>model"
  turn_end: ""

  # Compact evaluation contract optimized for low prefill/decode cost.
  empty_json_instruction: ""
  preamble: "Evaluate the survey answer."

  key_contract: >-
    Return only compact JSON {"followup_question":"","score":N}; no markdown.
    Score N=1-100 for relevance, completeness, and accuracy against the Expected answer target only.
    If Answer satisfies the target, followup_question MUST be "".
    Otherwise ask one short English question only for target-required information that is missing or ambiguous.
    Never ask for extra detail, invent uncertainty, or change topic.

  # All output requirements are folded into key_contract to minimize prompt tokens.
  length_budget: ""
  scoring_rule: ""
  strict_output: ""

prompts:
  - nodeId: Q1
    prompt: |-
      Expected answer target: average FAW yield loss over the last 3 seasons (% or bags/acre).
      Question: {{QUESTION}}
      Answer: {{ANSWER}}

  - nodeId: Q2
    prompt: |-
      Expected answer target: maximum yield loss acceptable for harvesting 10 days earlier (% or bags/acre).
      Question: {{QUESTION}}
      Answer: {{ANSWER}}

  - nodeId: Q3
    prompt: |-
      Expected answer target: a clear variety-switching damage threshold with metric, level, and stage.
      Question: {{QUESTION}}
      Answer: {{ANSWER}}

  - nodeId: Q4
    prompt: |-
      Expected answer target: replacement-variety priorities with at least one measurable target (DTM, FAW, drought stage, or yield).
      Question: {{QUESTION}}
      Answer: {{ANSWER}}

  - nodeId: Q5
    prompt: |-
      Expected answer target: minimum acceptable bad-year harvest, with baseline (% or bags/acre).
      Question: {{QUESTION}}
      Answer: {{ANSWER}}

  - nodeId: Q6
    prompt: |-
      Expected answer target: the most damaging drought crop stage plus a brief reason.
      Question: {{QUESTION}}
      Answer: {{ANSWER}}

model_defaults:
  default_model_url: "https://huggingface.co/google/gemma-3n-E4B-it-litert-lm/resolve/main/gemma-3n-E4B-it-int4.litertlm"
  default_file_name: "Gemma3n4B.litertlm"
  timeout_ms: 1800000
  ui_throttle_ms: 250
  ui_min_delta_bytes: 1048576

whisper:
  enabled: true
  asset_model_path: "models/ggml-small-q5_1.bin"
  language: "en"
  translate: false
  print_timestamp: false
  target_sample_rate: 16000
  record_sample_rates: [16000, 48000, 44100]
  compute_checksum: true