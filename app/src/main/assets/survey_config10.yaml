graph:
  startId: Start
  nodes:
    - id: Start
      type: START
      title: Start
      question: Start
      nextId: Q1

    - id: Q1
      type: TEXT
      title: Sub-County
      question: Which sub-county do you live in?
      nextId: Q2

    - id: Q2
      type: TEXT
      title: Ward
      question: Which ward do you live in?
      nextId: Q3

    - id: Q3
      type: SINGLE_CHOICE
      title: Respondent Gender
      question: Respondent Gender
      options:
        - Male
        - Female
      nextId: Q4

    - id: Q4
      type: SINGLE_CHOICE
      title: Respondent Age
      question: What is your age?
      options:
        - Under 35/Chini ya 35
        - 35-50
        - Over 50/Zaidi ya 50
      nextId: Q5

    - id: Q5
      type: TEXT
      title: Crops Grown
      question: Which crops do you grow?
      nextId: Q6

    - id: Q6
      type: TEXT
      title: Animals Kept
      question: Which animals do you keep?
      nextId: Q7

    - id: Q7
      type: SINGLE_CHOICE
      title: Years Growing White Maize
      question: How many years have you been growing white maize?
      options:
        - More than 2 years
        - Less than 2 years
      nextId: Q8
      nextIdByAnswer:
        "Less than 2 years": Done

    - id: Q8
      type: AI
      title: FAW Impact on Maize
      question: >-
        Has fall armyworm ever affected your maize? If yes, how did it affect your crop?
      nextId: Q9

    - id: Q9
      type: AI
      title: Yield Trade-off for 20-Day Earlier Harvest
      question: >-
        If harvesting your maize 20 days earlier reduced your yield, how much yield would you be willing to lose to harvest 20 days earlier?
      nextId: Q10

    - id: Q10
      type: AI
      title: Damage Threshold to Switch Variety
      question: >-
        How much pest or disease damage would make you switch to a different maize variety?
      nextId: Q11

    - id: Q11
      type: AI
      title: Traits Needed in Replacement Variety
      question: >-
        What traits would a new maize variety need to have for you to plant it instead of your current one?
      nextId: Q12

    - id: Q12
      type: AI
      title: Minimum Acceptable Harvest in Bad Season
      question: >-
        In a bad season, what is the lowest maize yield that would still make you continue planting your current maize variety?
      nextId: Q13

    - id: Q13
      type: AI
      title: Growth Stage Most Vulnerable to Drought
      question: >-
        During which stage of maize growth does drought cause the greatest losses or damage?
      nextId: Q14

    - id: Q14
      type: AI
      title: "Maize Allocation: Food, Feed, Sale"
      question: >-
        How do you decide how much maize to use for household food, livestock feed, sale, or other purposes?
      nextId: Q15

    - id: Q15
      type: AI
      title: White Maize for Livestock Feed
      question: >-
        If you use white maize to feed livestock, which animals receive it and how often?
      nextId: Q16

    - id: Q16
      type: AI
      title: Maize Seed Sourcing
      question: >-
        Where do you usually obtain the white maize seed that you plant, and why do you prefer getting it there?
      nextId: Q17

    - id: Q17
      type: AI
      title: Maize Selling Market
      question: >-
        Where do you usually sell your maize after harvest, and why do you choose that market or buyer?
      nextId: Review

    - id: Review
      type: REVIEW
      title: Review
      question: ''
      nextId: Done

    - id: Done
      type: DONE
      title: Done
      question: ''

slm:
  accelerator: GPU
  max_tokens: 512
  top_k: 1
  top_p: 0.0
  temperature: 0.0

  # Turn formatting (LiteRT-LM chat style)
  user_turn_prefix: "<start_of_turn>user"
  model_turn_prefix: "<start_of_turn>model"
  turn_end: ""

  # Compact evaluation contract optimized for low prefill/decode cost.
  empty_json_instruction: ""
  preamble: "Evaluate the survey answer."

  key_contract: >-
    Return only compact JSON {"followup_question":"","score":N}; no markdown.
    Score N=1-100 for relevance, completeness, and accuracy against the Expected answer target only.
    Empty followup_question is allowed ONLY when Answer fully satisfies every target-required point; then score MUST be 90-100.
    If any target-required point is missing or ambiguous, score MUST be below 90 and followup_question MUST contain exactly one short English question for that point.
    Never ask for extra detail, invent uncertainty, or change topic.

  # All output requirements are folded into key_contract to minimize prompt tokens.
  length_budget: ""
  scoring_rule: ""
  strict_output: ""
  followup_output_mode: TEXT
  key_contract_followup: >-
    Output exactly one short English question for missing or ambiguous target-required information.
    No score, JSON, analysis, explanation, or extra text.
  strict_output_followup: >-
    Output one question only on one line; no markdown, labels, or quotes.

prompts:
  - nodeId: Q8
    prompt: |-
      Expected answer target: Whether FAW affected the crop, and if so, a description of the effect (yield loss, damage type, etc.).
      Question: {{QUESTION}}
      Answer: {{ANSWER}}

  - nodeId: Q9
    prompt: |-
      Expected answer target: Maximum yield loss acceptable for harvesting 20 days earlier (% or bags/acre).
      Question: {{QUESTION}}
      Answer: {{ANSWER}}

  - nodeId: Q10
    prompt: |-
      Expected answer target: A clear pest/disease damage threshold that would trigger switching maize varieties.
      Question: {{QUESTION}}
      Answer: {{ANSWER}}

  - nodeId: Q11
    prompt: |-
      Expected answer target: Priority traits a new maize variety must have to replace the current one, ideally with a measurable target.
      Question: {{QUESTION}}
      Answer: {{ANSWER}}

  - nodeId: Q12
    prompt: |-
      Expected answer target: The lowest yield in a bad season that would still lead to continued planting of the current variety (% or bags/acre).
      Question: {{QUESTION}}
      Answer: {{ANSWER}}

  - nodeId: Q13
    prompt: |-
      Expected answer target: The maize growth stage where drought causes the greatest loss or damage.
      Question: {{QUESTION}}
      Answer: {{ANSWER}}

  - nodeId: Q14
    prompt: |-
      Expected answer target: The factors/criteria used to decide how maize is allocated across food, livestock feed, sale, and other uses.
      Question: {{QUESTION}}
      Answer: {{ANSWER}}

  - nodeId: Q15
    prompt: |-
      Expected answer target: Which animals are fed white maize and how often.
      Question: {{QUESTION}}
      Answer: {{ANSWER}}

  - nodeId: Q16
    prompt: |-
      Expected answer target: Where seed is usually obtained and the reason for preferring that source.
      Question: {{QUESTION}}
      Answer: {{ANSWER}}

  - nodeId: Q17
    prompt: |-
      Expected answer target: Where maize is usually sold after harvest and the reason for choosing that market/buyer.
      Question: {{QUESTION}}
      Answer: {{ANSWER}}

model_defaults:
  default_model_url: "https://huggingface.co/google/gemma-3n-E4B-it-litert-lm/resolve/main/gemma-3n-E4B-it-int4.litertlm"
  default_file_name: "Gemma3n4B.litertlm"
  timeout_ms: 1800000
  ui_throttle_ms: 250
  ui_min_delta_bytes: 1048576

whisper:
  enabled: true
  asset_model_path: "models/ggml-small-q5_1.bin"
  language: "en"
  translate: false
  print_timestamp: false
  target_sample_rate: 16000
  record_sample_rates: [16000, 48000, 44100]
  compute_checksum: true
