model_defaults:
  default_model_url: "https://huggingface.co/google/gemma-3n-E4B-it-litert-lm/resolve/main/gemma-3n-E4B-it-int4.litertlm"
  default_file_name: "Gemma3n4B.litertlm"
  timeout_ms: 1800000
  ui_throttle_ms: 250
  ui_min_delta_bytes: 1048576

whisper:
  enabled: true
  asset_model_path: "models/ggml-small-q5_1.bin"
  language: "en"
  translate: false
  print_timestamp: false
  target_sample_rate: 16000
  record_sample_rates: [16000, 48000, 44100]
  compute_checksum: true

tts:
  enabled: true
  language: "en"
  # Use only Google's TTS engine for English, so English questions are never read
  # by the Swahili engine even if it is the phone's default.
  # require_offline_voice: Google TTS must be installed AND have an English voice
  # downloaded for offline use; otherwise an error screen is shown before the SLM loads.
  engine: "com.google.android.tts"
  require_offline_voice: true
  auto_play: true
  speech_rate: 1.0
