ai_interaction:
  max_followups: 2

graph:
  startId: Start
  nodes:
    - id: Start
      type: START
      title: Start
      question: Start
      nextId: Q1

    - id: Q1
      type: TEXT
      title: Sub-County
      question: Which sub-county do you live in?
      nextId: Q2

    - id: Q2
      type: TEXT
      title: Ward
      question: Which ward do you live in?
      nextId: Q3

    - id: Q3
      type: SINGLE_CHOICE
      title: Respondent Gender
      question: Respondent Gender
      options:
        - Male
        - Female
      nextId: Q4

    - id: Q4
      type: SINGLE_CHOICE
      title: Respondent Age
      question: What is your age?
      options:
        - Under 35/Chini ya 35
        - 35-50
        - Over 50/Zaidi ya 50
      nextId: Q5

    - id: Q5
      type: TEXT
      title: Crops Grown
      question: Which crops do you grow?
      nextId: Q6

    - id: Q6
      type: TEXT
      title: Animals Kept
      question: Which animals do you keep?
      nextId: Q7

    - id: Q7
      type: SINGLE_CHOICE
      title: Years Growing White Maize
      question: How many years have you been growing white maize?
      options:
        - More than 2 years
        - Less than 2 years
      nextId: Q8
      nextIdByAnswer:
        "Less than 2 years": Done

    - id: Q8
      type: AI
      title: FAW Impact on Maize
      question: >-
        Has fall armyworm ever affected your maize? If yes, how did it affect your crop?
      nextId: Q9

    - id: Q9
      type: AI
      title: Yield Trade-off for 20-Day Earlier Harvest
      question: >-
        If harvesting your maize 20 days earlier reduced your yield, how much yield would you be willing to lose to harvest 20 days earlier?
      nextId: Q10

    - id: Q10
      type: AI
      title: Damage Threshold to Switch Variety
      question: >-
        How much pest or disease damage would make you switch to a different maize variety?
      nextId: Q11

    - id: Q11
      type: AI
      title: Traits Needed in Replacement Variety
      question: >-
        What traits would a new maize variety need to have for you to plant it instead of your current one?
      nextId: Q12

    - id: Q12
      type: AI
      title: Minimum Acceptable Harvest in Bad Season
      question: >-
        In a bad season, what is the lowest maize yield that would still make you continue planting your current maize variety?
      nextId: Q13

    - id: Q13
      type: AI
      title: Growth Stage Most Vulnerable to Drought
      question: >-
        During which stage of maize growth does drought cause the greatest losses or damage?
      nextId: Q14

    - id: Q14
      type: AI
      title: "Maize Allocation: Food, Feed, Sale"
      question: >-
        How do you decide how much maize to use for household food, livestock feed, sale, or other purposes?
      nextId: Q15

    - id: Q15
      type: AI
      title: White Maize for Livestock Feed
      question: >-
        If you use white maize to feed livestock, which animals receive it and how often?
      nextId: Q16

    - id: Q16
      type: AI
      title: Maize Seed Sourcing
      question: >-
        Where do you usually obtain the white maize seed that you plant, and why do you prefer getting it there?
      nextId: Q17

    - id: Q17
      type: AI
      title: Maize Selling Market
      question: >-
        Where do you usually sell your maize after harvest, and why do you choose that market or buyer?
      nextId: Review

    - id: Review
      type: REVIEW
      title: Review
      question: ''
      nextId: Done

    - id: Done
      type: DONE
      title: Done
      question: ''

slm:
  accelerator: GPU
  max_tokens: 512
  top_k: 1
  top_p: 0.0
  temperature: 0.0

  # Turn formatting (LiteRT-LM chat style)
  user_turn_prefix: "<start_of_turn>user"
  model_turn_prefix: "<start_of_turn>model"
  turn_end: ""

  preamble: "Evaluate only the original survey target using all supplied answers."
  empty_json_instruction: ""
  key_contract_eval: >-
    Return only compact JSON {"score":N,"missing_points":[],"followup_needed":false}.
    N must be an integer 1-100 for relevance, completeness and accuracy against the original target.
    Evaluate the original answer and all answered followup pairs together.
    Score 90-100 only when all target-required information is satisfied; otherwise score below 90.
    For score below 90, missing_points must contain the specific missing or ambiguous target-required information
    and followup_needed must be true. Otherwise missing_points is empty and followup_needed is false.
    Do not generate a question. Do not penalize style or request information outside the target.
    Write missing_points in English.
  strict_output_eval: "One JSON object only; no markdown or generated question."
  length_budget_eval: "Keep missing_points concise."
  followup_output_mode: TEXT
  key_contract_followup: >-
    Generate exactly one short English question addressing one unresolved target-required deficiency in EVAL_JSON.
    Use the original target, original answer and accumulated answered followup pairs.
    Do not repeat an earlier question or ask for information already provided. Never add new objectives.
    Output only the question on one line; no JSON, score, analysis, labels, or quotes.
  strict_output_followup: "Exactly one English question on one line."
  length_budget_followup: "Keep the question short and single-scope."

