title: Maize (English)

ai_interaction:
  max_followups: 2

graph:
  startId: Start
  nodes:
    - id: Start
      type: START
      title: Survey Note
      question: Add any general notes and press Start.
      read_aloud: false
      nextId: Pre1

    - id: Pre1
      type: TEXT
      title: Observer
      question: Observer Name
      read_aloud: false
      nextId: Pre2

    - id: Pre2
      type: TEXT
      title: Interviewer
      question: Interviewer Name
      read_aloud: false
      nextId: Pre3

    - id: Pre3
      type: TEXT
      title: Respondent
      question: Respondent Name
      read_aloud: false
      nextId: Pre4

    - id: Pre4
      type: TEXT
      title: Respondent ID
      question: Respondent ID
      read_aloud: false
      nextId: Pre5

    - id: Pre5
      type: SINGLE_CHOICE
      title: CIMMYT Phone
      question: Please select your phone
      options:
        - Phone 1
        - Phone 2
        - Phone 3
      read_aloud: false
      nextId: Q00

    - id: Q00
      type: SINGLE_CHOICE
      title: Introduction & Consent
      question: |-
        Hallo. Thank you for making time for us today.

        I work with CIMMYT, an organization that conducts research to improve the production of maize, wheat, and other crops in different countries across Africa, Asia, and Latin America.

        We are carrying out this study to learn about farmers’ experiences, challenges, and preferences when growing white maize. The information you share will help researchers better understand farmers’ needs and support the development of better maize varieties in the future.

        During the interview, we will use a mobile phone to help record and organize your responses. This will help us capture your answers accurately and make sure we do not miss any important information.

        Your participation is voluntary. You may choose not to answer any question or stop the interview at any time. The information you provide will be kept private and used only for research purposes. There are no right or wrong answers—we simply want to hear about your real experiences and views.

        The interview will take about 45 minutes.

        Thank you very much for taking part in this study.

        The study is led by Dr. Mercy Mbugua. If you have any questions or concerns about the study, you can contact her on +254 724 740 197.

        Do you agree to participate?
      options:
        - Yes, and proceed
        - No, and stop the interview
      read_aloud: true
      nextId: Q01
      nextIdByAnswer:
        "Yes, and proceed": Q01
        "No, and stop the interview": ConsentDeclined

    - id: ConsentDeclined
      type: STOP
      title: No, and stop the interview
      question: The interview has been stopped.
      read_aloud: false

    - id: Q01
      type: SINGLE_CHOICE
      title: "Q01: Location"
      question: Which sub-county and ward do you live in?
      options:
        - Githunguri – Githunguri
        - Gatundu South – Ndarugu
        - Gatundu South – Ngenda
        - Gatundu North – Githobokoni
        - Gatundu North – Gituamba
        - Other / Nyingine
      read_aloud: false
      other_text_option: Other / Nyingine
      nextId: Q02

    - id: Q02
      type: SINGLE_CHOICE
      title: "Q02: Gender"
      question: Respondent Gender
      options:
        - Male
        - Female
      read_aloud: false
      nextId: Q03

    - id: Q03
      type: NUMBER
      title: "Q03: Age"
      question: What is your age?
      special_options:
        - Prefer not to say
      nextId: Q04

    - id: Q04
      type: TEXT
      title: "Q04: Crops"
      question: Which crops do you grow?
      nextId: Q05

    - id: Q05
      type: TEXT
      title: "Q05: Livestock"
      question: Which livestock do you keep?
      nextId: Q06

    - id: Q06
      type: NUMBER
      title: "Q06: Experience"
      question: How many years have you been growing white maize?
      special_options:
        - Prefer not to say
      numeric_routes:
        - less_than_or_equal: 2
          next_id: Done
      nextId: Q07
      nextIdByAnswer:
        "Prefer not to say": Done

    - id: Q07
      type: AI
      title: FAW Impact on Maize
      question: >-
        Has fall armyworm ever attacked your maize? If yes, what loss did you get?
      nextId: Q08

    - id: Q08
      type: AI
      title: Yield Trade-off for 20-Day Earlier Harvest
      question: >-
        Please listen to this example: if you could harvest your maize 20 days early, but your harvest would be smaller, how many bags of harvest would you accept to lose?
      nextId: Q09

    - id: Q09
      type: AI
      title: Damage Threshold to Switch Variety
      question: >-
        If pests or diseases damage your maize, how many bags would you need to lose before deciding to change your seed?
      nextId: Q10

    - id: Q10
      type: AI
      title: Traits Needed in Replacement Variety
      question: >-
        If there is a new maize seed, what characteristics would make you stop using your current seed and use the new one?
      nextId: Q11

    - id: Q11
      type: AI
      title: Minimum Acceptable Harvest in Bad Season
      question: >-
        If you and other farmers in your area harvested very little maize, below how many bags would you decide to change your seed?
      nextId: Q12

    - id: Q12
      type: AI
      title: Growth Stage Most Vulnerable to Drought
      question: >-
        When does drought damage your maize the most: when the plants are young, when they are flowering, when they have started producing cobs, or at what other time?
      nextId: Q13

    - id: Q13
      type: AI
      title: "Maize Allocation: Food, Feed, Sale"
      question: >-
        After harvest, how do you divide your maize? How do you decide the amount for each use, for example food, animals, selling, or other uses?
      nextId: Q14a

    - id: Q14a
      type: SINGLE_CHOICE
      title: "Q14a: White Maize for Animal Feed"
      question: Do you use white maize to feed animals?
      options:
        - "Yes"
        - "No"
      read_aloud: true
      nextId: Q15
      nextIdByAnswer:
        "Yes": Q14b
        "No": Q15

    - id: Q14b
      type: AI
      title: White Maize for Livestock Feed
      question: >-
        Which animals do you feed white maize, and how often?
      required_component_catalog:
        - id: animals
          text: "Which animals receive white maize"
        - id: feeding_frequency
          text: "How often white maize is fed"
      nextId: Q15

    - id: Q15
      type: AI
      title: Maize Seed Sourcing
      question: >-
        Where do you usually get your white maize seed, and why do you like getting it from there?
      required_component_catalog:
        - id: seed_source
          text: "Usual source of white maize seed"
        - id: source_reason
          text: "Reason for preferring that source"
      nextId: Q16

    - id: Q16
      type: AI
      title: Maize Selling Market
      question: >-
        Where do you usually sell your maize after harvesting, and why do you choose to sell there?
      required_component_catalog:
        - id: sale_destination
          text: "Usual market or buyer after harvest"
        - id: destination_reason
          text: "Reason for choosing that market or buyer"
      nextId: Q17

    - id: Q17
      type: INFO
      title: End of Interview
      question: Thank you very much for taking your time to answer these questions.
      read_aloud: true
      nextId: Review

    - id: Review
      type: REVIEW
      title: Review
      question: ''
      nextId: Done

    - id: Done
      type: DONE
      title: Done
      question: ''

slm:
  accelerator: GPU
  max_tokens: 1024
  top_k: 1
  top_p: 0.0
  temperature: 0.0

  # Turn formatting (LiteRT-LM chat style)
  user_turn_prefix: "<start_of_turn>user"
  model_turn_prefix: "<start_of_turn>model"
  turn_end: ""

  preamble: "Evaluate only the original survey target using all supplied answers."
  empty_json_instruction: ""
  key_contract_eval: >-
    Return only compact JSON {"score":N,"missing_points":[],"followup_needed":false}.
    N must be an integer 1-100 for relevance, completeness and accuracy against the original target.
    Evaluate the original answer and all answered followup pairs together.
    Before emitting JSON, compare every candidate missing point against the original answer and every answered follow-up pair. If an answered follow-up directly supplies that information, do not include it in missing_points. Recompute score, missing_points, and followup_needed together as one consistent final decision.
    Treat each independently answerable required component as a separate missing_points item; never combine independently answerable deficiencies. After every answered follow-up, recompute components independently and omit each supplied component even when another component from the same target remains missing.
    When a Required component catalog is present, evaluate each catalog item independently: missing_points may contain only configured component IDs. Omit IDs whose component is supplied by the original answer or answered follow-up pairs; never return component descriptions or questions as missing_points. When a Required components block is present, missing_points may contain only the exact text of unresolved configured components.
    Separate relevance from completeness. An answer can discuss the right topic but still be incomplete.
    Score 90-100 only when the respondent explicitly provides every material component requested by the Expected answer target and Question.
    Do not infer missing details from general knowledge, plausibility, or a bare statement that an event occurred.
    A concise answer may be complete. A verbose or relevant answer that omits any material requested component must score below 90.
    For example, saying that an event occurred without describing its requested effect is incomplete.
    Consistency rule: if missing_points is non-empty or followup_needed is true, score must be an integer from 1 to 89.
    Scores 90-100 are allowed only when missing_points=[] and followup_needed=false.
    Never use score 90 as a borderline value when anything is missing.
    For any score below 90, missing_points must contain the specific missing or ambiguous target-required information
    and followup_needed must be true. Otherwise missing_points is empty and followup_needed is false.
    Do not generate a question. Do not penalize style or request information outside the target.
    Write missing_points in English.
  strict_output_eval: "One JSON object only; no markdown or generated question."
  length_budget_eval: "Keep missing_points concise."
  followup_output_mode: TEXT
  key_contract_followup: >-
    Generate exactly one short English question addressing one unresolved target-required deficiency in EVAL_JSON.
    Use the original target, original answer and accumulated answered followup pairs.
    Do not repeat an earlier question or ask for information already provided. Never add new objectives.
    Output only the question on one line; no JSON, score, analysis, labels, or quotes.
  strict_output_followup: "Exactly one English question on one line."
  length_budget_followup: "Keep the question short and single-scope."

