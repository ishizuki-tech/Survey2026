      title: Miaka ya Kulima Mahindi Meupe
      question: Umekuwa ukilima mahindi meupe kwa muda gani?
      options:
        - Zaidi ya miaka 2
        - Chini ya miaka 2
      nextId: Q8
      nextIdByAnswer:
        "Chini ya miaka 2": Done

    - id: Q8
      type: AI
      title: Athari ya FAW kwa Mahindi
      question: >-
        Je, minyoo ya majani (Fall Armyworm) imewahi kuathiri mahindi yako? Ikiwa ndiyo, iliathiri vipi mazao yako?
      nextId: Q9

    - id: Q9
      type: AI
      title: Kubadilishana Mavuno kwa Kuvuna Siku 20 Mapema
      question: >-
        Ikiwa kuvuna mahindi yako siku 20 mapema kungepunguza mavuno, ungekubali kupoteza kiasi gani cha mavuno ili uweze kuvuna siku 20 mapema?
      nextId: Q10

    - id: Q10
      type: AI
      title: Kizingiti cha Uharibifu cha Kubadilisha Aina ya Mahindi
      question: >-
        Ni kiwango gani cha uharibifu wa wadudu au magonjwa ambacho kingekufanya ubadilishe na kujaribu aina nyingine ya mahindi?
      nextId: Q11

    - id: Q11
      type: AI
      title: Sifa Zinazohitajika kwa Aina Mbadala
      question: >-
        Aina mpya ya mahindi ingehitaji kuwa na sifa gani ili ujaribu kuipanda badala ya ile ya sasa?
      nextId: Q12

    - id: Q12
      type: AI
      title: Mavuno ya Chini Yanayokubalika Msimu Mbaya
      question: >-
        Ikiwa msimu ni mbaya, ni mavuno ya chini kiasi gani ya mahindi bado yangekufanya uendelee kutumia aina hii ya mbegu?
      nextId: Q13

    - id: Q13
      type: AI
      title: Hatua ya Ukuaji Inayoathiriwa Zaidi na Ukame
      question: >-
        Ukame huwa tatizo kubwa zaidi katika hatua gani ya ukuaji wa mahindi?
      nextId: Q14

    - id: Q14
      type: AI
      title: "Ugawaji wa Mahindi: Chakula, Malisho, Kuuza"
      question: >-
        Unaamuaje kiasi cha mahindi kitakachotumika kwa chakula cha familia, malisho ya mifugo, kuuza, au matumizi mengine?
      nextId: Q15

    - id: Q15
      type: AI
      title: Mahindi Meupe kwa Chakula cha Mifugo
      question: >-
        Ikiwa unatumia mahindi meupe kulisha mifugo, ni mifugo gani hupatiwa na kwa mara ngapi?
      nextId: Q16

    - id: Q16
      type: AI
      title: Chanzo cha Mbegu za Mahindi
      question: >-
        Kwa kawaida unapata wapi mbegu za mahindi meupe unazopanda, na kwa nini unachagua mbinu hiyo?
      nextId: Q17

    - id: Q17
      type: AI
      title: Soko la Kuuzia Mahindi
      question: >-
        Kwa kawaida unauza mahindi yako wapi baada ya kuvuna, na kwa nini unachagua soko au mnunuzi huyo?
      nextId: Review

    - id: Review
      type: REVIEW
      title: Review
      question: ''
      nextId: Done

    - id: Done
      type: DONE
      title: Done
      question: ''

slm:
  # Runtime
  accelerator: "GPU"
  max_tokens: 4096
  top_k: 64
  top_p: 0.95
  temperature: 1.0

  # Turn formatting (LiteRT-LM chat style)
  user_turn_prefix: "<start_of_turn>user"
  model_turn_prefix: "<start_of_turn>model"
  turn_end: ""

  # System prompt pieces
  empty_json_instruction: "Jibu kwa kitu cha JSON kilicho tupu: {}"
  preamble: "Wewe ni mtaalamu mashuhuri wa tafiti za wakulima. Soma Swali na Jibu."

  key_contract: |
    OUTPUT FORMAT:
    - In Swahili.
    - Keys exactly:
      • "analysis": short string
      • "expected_answer": short string
      • "followup_question": a single short confirm/validate question (NOT an array; may be empty string)
      • "score": integer 1–100

    FOLLOW-UP INTENT:
    - The follow-up must confirm or clarify the respondent's original answer to the SAME question.
    - Target the biggest uncertainty: missing unit/scale, missing number, time window, baseline, or method used.
    - Keep it single-scope (no multi-part), concrete, and answerable immediately.
    - Do not introduce new topics or additional objectives.

  length_budget: |
    LENGTH LIMITS:
    - analysis<=60 chars
    - expected_answer<=120 chars
    - followup_question<=120 chars

  scoring_rule: "Scoring rule: Judge ONLY content relevance/completeness/accuracy. Do NOT penalize style or formatting."

  strict_output: |-
    STRICT OUTPUT (NO MARKDOWN):
    - RAW JSON only, ONE LINE.
    - Use COMPACT JSON (no spaces around ':' and ',').
    - No extra text.

prompts:
  - nodeId: Q8
    prompt: |-
      Kazi:
      - Tambua udhaifu (haijulikani kama FAW iliathiri au la, maelezo ya athari hayapo).
      - Toa expected_answer moja thabiti: kama FAW iliathiri mazao, na maelezo ya athari hiyo (upotevu wa mavuno, aina ya uharibifu, n.k.).
      - Uliza followup_question 1 tu ili kuthibitisha JIBU HILO HILO (au "" ikiwa halihitajiki).
      - Toa score 1–100.

      Swali: {{QUESTION}}
      Jibu: {{ANSWER}}

