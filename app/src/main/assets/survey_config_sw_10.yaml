ai_interaction:
  max_followups: 2

graph:
  startId: Start
  nodes:
    - id: Start
      type: START
      title: Start
      question: Start
      nextId: Introduction

    - id: Introduction
      type: INFO
      title: Utangulizi wa mahojiano
      question: |-
        Habari yako leo? Asante kwa kutupatia muda wako leo.

        Mimi ninafanya kazi na CIMMYT. Ni shirika linalofanya utafiti wa kuboresha kilimo cha mahindi, ngano na mazao mengine katika nchi mbalimbali.

        Leo tunafanya utafiti kuhusu mahindi meupe. Tungependa kusikia kuhusu uzoefu wako wa kulima mahindi, changamoto unazokutana nazo, na aina ya mahindi unayopendelea.

        Wakati wa mahojiano, tutatumia simu ya mkononi kusaidia kurekodi na kupanga majibu yako. Hii itatusaidia kuhakikisha kwamba tunapata taarifa zako vizuri na hakuna jambo muhimu tunalosahau.

        Kushiriki ni kwa hiari. Unaweza kuamua kutokujibu swali lolote, au kusimamisha mahojiano wakati wowote. Taarifa utakazotupatia zitawekwa kwa siri na zitatumika kwa utafiti pekee.

        Pia, hakuna jibu sahihi au lisilo sahihi. Tunataka tu kusikia maoni yako na uzoefu wako halisi.

        Mahojiano yatachukua takribani dakika 45.

        Asante sana kwa kutenga muda wako na kushiriki nasi leo.

        Utafiti huu unaongozwa na Daktari Mercy Mbugua. Kama una swali lolote kuhusu utafiti huu, unaweza kumpigia simu kwa +254 724 740 197.
      read_aloud: true
      nextId: Consent

    - id: Consent
      type: SINGLE_CHOICE
      title: Ridhaa
      question: Je, Kabla tuanze, uko tayari kuendelea na mahojiano?
      options:
        - Ndiyo, nakubali kushiriki
        - Hapana, sikubali kushiriki
      read_aloud: true
      nextId: Q1
      nextIdByAnswer:
        "Ndiyo, nakubali kushiriki": Q1
        "Hapana, sikubali kushiriki": ConsentDeclined

    - id: ConsentDeclined
      type: STOP
      title: Hapana, sikubali kushiriki
      question: Mahojiano yamesitishwa.
      read_aloud: false

    - id: Q1
      type: SINGLE_CHOICE
      title: Sub-county na Ward
      question: Unaishi sub-county na ward gani?
      options:
        - Githunguri – Githunguri
        - Gatundu South – Ndarugu
        - Gatundu South – Ngenda
        - Gatundu North – Githobokoni
        - Gatundu North – Gituamba
        - Other / Nyingine
      read_aloud: false
      other_text_option: Other / Nyingine
      nextId: Q2

    - id: Q2
      type: SINGLE_CHOICE
      title: Jinsia ya Mhojiwa
      question: Jinsia ya Mhojiwa
      options:
        - Mwanaume
        - Mwanamke
      read_aloud: false
      nextId: Q3

    - id: Q3
      type: NUMBER
      title: Umri wa Mhojiwa
      question: Una miaka mingapi?
      special_options:
        - Sipendi kusema
      nextId: Q4

    - id: Q4
      type: TEXT
      title: Mimea Inayolimwa
      question: Unalima mazao gani?
      nextId: Q5

    - id: Q5
      type: TEXT
      title: Wanyama Wanaofugwa
      question: Unafuga wanyama gani?
      nextId: Q6

    - id: Q6
      type: NUMBER
      title: Miaka ya Kulima Mahindi Meupe
      question: Umekuwa ukilima mahindi meupe kwa miaka mingapi?
      special_options:
        - Sipendi kusema
      numeric_routes:
        - less_than_or_equal: 2
          next_id: Done
      nextId: Q7
      nextIdByAnswer:
        "Sipendi kusema": Done

    - id: Q7
      type: AI
      title: Athari ya FAW kwa Mahindi
      question: >-
        Mahindi yako yamewahi kushambuliwa na funza jeshi (Fall Armyworm)? Ikiwa ndiyo, yalipata hasara gani?
      nextId: Q8

    - id: Q8
      type: AI
      title: Kubadilishana Mavuno kwa Kuvuna Siku 20 Mapema
      question: >-
        Kama ungeweza kuvuna mahindi yako siku 20 mapema, lakini mavuno yangepungua, ungekubali kupoteza kiasi gani cha mavuno ili uvune mapema?
      nextId: Q9

    - id: Q9
      type: AI
      title: Kizingiti cha Uharibifu cha Kubadilisha Aina ya Mahindi
      question: >-
        Ni kiwango gani cha uharibifu wa mahindi unaosababishwa na wadudu au magonjwa ambacho kingekufanya ubadilishe aina ya mahindi unayopanda?
      nextId: Q10

    - id: Q10
      type: AI
      title: Sifa Zinazohitajika kwa Aina Mbadala
      question: >-
        Kama kungekuwa na aina mpya ya mahindi, ingehitaji kuwa na sifa gani ili uamue kuipanda badala ya aina unayopanda sasa?
      nextId: Q11

    - id: Q11
      type: AI
      title: Mavuno ya Chini Yanayokubalika Msimu Mbaya
      question: >-
        Msimu ukiwa mbaya, ni mavuno ya chini kiasi gani ambayo bado yangekufanya uendelee kupanda aina hii ya mahindi?
      nextId: Q12

    - id: Q12
      type: AI
      title: Hatua ya Ukuaji Inayoathiriwa Zaidi na Ukame
      question: >-
        Ukame huwa unasababisha hasara kubwa zaidi wakati gani katika ukuaji wa mahindi?
      nextId: Q13

    - id: Q13
      type: AI
      title: "Ugawaji wa Mahindi: Chakula, Malisho, Kuuza"
      question: >-
        Unaamua aje kiasi cha mahindi cha kuweka kwa matumizi ya nyumbani, kulisha mifugo, kuuza, au matumizi mengine?
      nextId: Q14

    - id: Q14
      type: AI
      title: Mahindi Meupe kwa Chakula cha Mifugo
      question: >-
        Kama unatumia mahindi meupe kulisha mifugo, unawalisha mifugo gani na mara ngapi?
      nextId: Q15

    - id: Q15
      type: AI
      title: Chanzo cha Mbegu za Mahindi
      question: >-
        Kwa kawaida unapata wapi mbegu za mahindi meupe unazopanda, na kwa nini unapendelea kununua au kupata mbegu huko?
      nextId: Q16

    - id: Q16
      type: AI
      title: Soko la Kuuzia Mahindi
      question: >-
        Kwa kawaida baada ya kuvuna, unauza mahindi yako wapi, na kwa nini unapendelea kuuza huko au kwa mnunuzi huyo?
      nextId: Review

    - id: Review
      type: REVIEW
      title: Review
      question: ''
      nextId: Done

    - id: Done
      type: DONE
      title: Done
      question: ''

slm:
  # Runtime
  accelerator: "GPU"
  max_tokens: 4096
  top_k: 64
  top_p: 0.95
  temperature: 1.0

  # Turn formatting (LiteRT-LM chat style)
  user_turn_prefix: "<start_of_turn>user"
  model_turn_prefix: "<start_of_turn>model"
  turn_end: ""

  preamble: "Evaluate only the original survey target using all supplied answers."
  empty_json_instruction: ""
  key_contract_eval: >-
    Return only compact JSON {"score":N,"missing_points":[],"followup_needed":false}.
    N must be an integer 1-100 for relevance, completeness and accuracy against the original target.
    Evaluate the original answer and all answered followup pairs together.
    Kabla ya kutoa JSON, linganisha kila taarifa inayodhaniwa kukosekana na jibu la awali na kila jozi ya swali la ufuatiliaji na jibu lake iliyojibiwa. Ikiwa jibu la ufuatiliaji lililojibiwa linatoa moja kwa moja taarifa hiyo, usiiweke katika missing_points. Hesabu upya score, missing_points, na followup_needed pamoja kama uamuzi mmoja wa mwisho unaolingana.
    Tofautisha uhusiano na ukamilifu. Jibu linaweza kuwa kuhusu mada husika lakini bado lisikamilike.
    Toa alama 90-100 tu wakati mhojiwa ametoa kwa wazi kila kipengele muhimu kinachohitajika katika Lengo la jibu na Swali.
    Usikisie maelezo yanayokosekana kutokana na maarifa ya jumla, uwezekano, au kauli tupu kwamba tukio lilitokea.
    Jibu fupi linaweza kuwa kamili. Jibu refu au linalohusu mada lakini linaloacha kipengele chochote muhimu kinachohitajika lipate chini ya 90.
    Kwa mfano, kusema kwamba tukio lilitokea bila kueleza athari iliyoombwa ni jibu lisilokamilika.
    Kanuni ya ulinganifu: ikiwa missing_points si tupu au followup_needed ni true, score lazima iwe nambari kamili kutoka 1 hadi 89.
    Alama 90-100 zinaruhusiwa tu wakati missing_points=[] na followup_needed=false.
    Usitumie score 90 kama alama ya mpaka wakati kuna kitu chochote kinachokosekana.
    For score below 90, missing_points must contain the specific missing or ambiguous target-required information
    and followup_needed must be true. Otherwise missing_points is empty and followup_needed is false.
    Do not generate a question. Do not penalize style or request information outside the target.
    Write missing_points in Swahili.
  strict_output_eval: "One JSON object only; no markdown or generated question."
  length_budget_eval: "Keep missing_points concise."
  followup_output_mode: TEXT
  key_contract_followup: >-
    Uliza swali moja tu la Kiswahili, fupi na la mazungumzo ya kawaida kwa mhojiwa.
    Uliza moja kwa moja taarifa moja tu ambayo imeorodheshwa kuwa inakosekana katika EVAL_JSON.
    Tumia Lengo la jibu, jibu la awali na majibu ya ufuatiliaji yaliyopo kwa muktadha pekee.
    Usirudie au kufafanua tena swali lote la awali, wala usiulize taarifa ambayo tayari imetolewa.
    Tumia sentensi moja rahisi; usieleze kwa nini taarifa inahitajika, usitumie maneno ya kujaza kama "ili kujua" au "ili kuelewa",
    na usirudie nomino, dhana au kifungu bila sababu. Usiongeze malengo mapya, usibuni ukweli, wala usikisie jibu linalokosekana.
    Usichanganye taarifa nyingi zisizohusiana katika sentensi ndefu. Toa swali pekee kwenye mstari mmoja; hakuna JSON, alama, uchambuzi, lebo au nukuu.
  strict_output_followup: "Swali moja la Kiswahili (Swahili), fupi, la mazungumzo na sentensi moja tu."
  length_budget_followup: "Liwe fupi, la moja kwa moja na lenye jambo moja tu."

