        Kwa kawaida unapata wapi mbegu za mahindi meupe unazopanda, na kwa nini unachagua mbinu hiyo?
      nextId: Q17

    - id: Q17
      type: AI
      title: Soko la Kuuzia Mahindi
      question: >-
        Kwa kawaida unauza mahindi yako wapi baada ya kuvuna, na kwa nini unachagua soko au mnunuzi huyo?
      nextId: Review

    - id: Review
      type: REVIEW
      title: Review
      question: ''
      nextId: Done

    - id: Done
      type: DONE
      title: Done
      question: ''

slm:
  # Runtime
  accelerator: "GPU"
  max_tokens: 4096
  top_k: 64
  top_p: 0.95
  temperature: 1.0

  # Turn formatting (LiteRT-LM chat style)
  user_turn_prefix: "<start_of_turn>user"
  model_turn_prefix: "<start_of_turn>model"
  turn_end: ""

  preamble: "Evaluate only the original survey target using all supplied answers."
  empty_json_instruction: ""
  key_contract_eval: >-
    Return only compact JSON {"score":N,"missing_points":[],"followup_needed":false}.
    N must be an integer 1-100 for relevance, completeness and accuracy against the original target.
    Evaluate the original answer and all answered followup pairs together.
    Kabla ya kutoa JSON, linganisha kila taarifa inayodhaniwa kukosekana na jibu la awali na kila jozi ya swali la ufuatiliaji na jibu lake iliyojibiwa. Ikiwa jibu la ufuatiliaji lililojibiwa linatoa moja kwa moja taarifa hiyo, usiiweke katika missing_points. Hesabu upya score, missing_points, na followup_needed pamoja kama uamuzi mmoja wa mwisho unaolingana.
    Tofautisha uhusiano na ukamilifu. Jibu linaweza kuwa kuhusu mada husika lakini bado lisikamilike.
    Toa alama 90-100 tu wakati mhojiwa ametoa kwa wazi kila kipengele muhimu kinachohitajika katika Lengo la jibu na Swali.
    Usikisie maelezo yanayokosekana kutokana na maarifa ya jumla, uwezekano, au kauli tupu kwamba tukio lilitokea.
    Jibu fupi linaweza kuwa kamili. Jibu refu au linalohusu mada lakini linaloacha kipengele chochote muhimu kinachohitajika lipate chini ya 90.
    Kwa mfano, kusema kwamba tukio lilitokea bila kueleza athari iliyoombwa ni jibu lisilokamilika.
    Kanuni ya ulinganifu: ikiwa missing_points si tupu au followup_needed ni true, score lazima iwe nambari kamili kutoka 1 hadi 89.
    Alama 90-100 zinaruhusiwa tu wakati missing_points=[] na followup_needed=false.
    Usitumie score 90 kama alama ya mpaka wakati kuna kitu chochote kinachokosekana.
    For score below 90, missing_points must contain the specific missing or ambiguous target-required information
    and followup_needed must be true. Otherwise missing_points is empty and followup_needed is false.
    Do not generate a question. Do not penalize style or request information outside the target.
    Write missing_points in Swahili.
  strict_output_eval: "One JSON object only; no markdown or generated question."
  length_budget_eval: "Keep missing_points concise."
  followup_output_mode: TEXT
  key_contract_followup: >-
    Uliza swali moja tu la Kiswahili, fupi na la mazungumzo ya kawaida kwa mhojiwa.
    Uliza moja kwa moja taarifa moja tu ambayo imeorodheshwa kuwa inakosekana katika EVAL_JSON.
    Tumia Lengo la jibu, jibu la awali na majibu ya ufuatiliaji yaliyopo kwa muktadha pekee.
    Usirudie au kufafanua tena swali lote la awali, wala usiulize taarifa ambayo tayari imetolewa.
    Tumia sentensi moja rahisi; usieleze kwa nini taarifa inahitajika, usitumie maneno ya kujaza kama "ili kujua" au "ili kuelewa",
    na usirudie nomino, dhana au kifungu bila sababu. Usiongeze malengo mapya, usibuni ukweli, wala usikisie jibu linalokosekana.
    Usichanganye taarifa nyingi zisizohusiana katika sentensi ndefu. Toa swali pekee kwenye mstari mmoja; hakuna JSON, alama, uchambuzi, lebo au nukuu.
  strict_output_followup: "Swali moja la Kiswahili (Swahili), fupi, la mazungumzo na sentensi moja tu."
  length_budget_followup: "Liwe fupi, la moja kwa moja na lenye jambo moja tu."

